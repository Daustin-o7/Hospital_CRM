server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets emitted by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA: service worker + manifest must not be cached aggressively
    location = /sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lab uploads static file proxy
    location /lab-uploads/ {
        proxy_pass http://api:8080/lab-uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback - hand every non-asset route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
