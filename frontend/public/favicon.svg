<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#tealGrad)"/>
  
  <!-- Unique healthcare symbol: Cross with integrated pulse/heartbeat -->
  <g transform="translate(32, 32)">
    <!-- Vertical pulse line (heartbeat) -->
    <path d="M0 -18 Q0 -14 0 -10 T0 2 T0 14" 
          stroke="white" stroke-width="2.5" fill="none" 
          stroke-linecap="round" stroke-linejoin="round"
          opacity="0.9"/>
    
    <!-- Horizontal cross bar -->
    <path d="M-12 0 H12" 
          stroke="white" stroke-width="3.5" fill="none" 
          stroke-linecap="round" opacity="0.95"/>
    
    <!-- Vertical cross bar (integrated with pulse) -->
    <path d="M0 -16 V16" 
          stroke="white" stroke-width="3.5" fill="none" 
          stroke-linecap="round" opacity="0.95"/>
    
    <!-- Subtle heart indicator at pulse peak -->
    <path d="M-3 -10 Q-3 -12 -1 -12 Q1 -12 1 -10 Q1 -8 -1 -8 Q-3 -8 -3 -10" 
          fill="white" opacity="0.85" transform="scale(0.6)"/>
  </g>
</svg>