<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="emblemBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="crossVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="crossHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Container Squircle Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#emblemBgLight)" stroke="#0d9488" stroke-width="1.8" stroke-opacity="0.3" />

  <!-- Precision Rounded Medical Cross -->
  <rect x="40" y="20" width="20" height="60" rx="10" fill="url(#crossVertical)" />
  <rect x="20" y="40" width="60" height="20" rx="10" fill="url(#crossHorizontal)" opacity="0.92" />

  <!-- Center Vitality Core -->
  <circle cx="50" cy="50" r="13" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
  <path d="M 43 50 H 46 L 48.5 45.5 L 51.5 54.5 L 53.5 48 L 55 50 H 57" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>