<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="emblemBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2330" />
      <stop offset="50%" stop-color="#081e28" />
      <stop offset="100%" stop-color="#041117" />
    </linearGradient>
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="crossVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="crossHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Container Squircle Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#emblemBgDark)" stroke="url(#emblemBorder)" stroke-width="1.8" />

  <!-- Precision Rounded Medical Cross -->
  <rect x="40" y="20" width="20" height="60" rx="10" fill="url(#crossVertical)" />
  <rect x="20" y="40" width="60" height="20" rx="10" fill="url(#crossHorizontal)" opacity="0.92" />

  <!-- Center Vitality Core -->
  <circle cx="50" cy="50" r="13" fill="#081e28" stroke="#2dd4bf" stroke-width="2" />
  <path d="M 43 50 H 46 L 48.5 45.5 L 51.5 54.5 L 53.5 48 L 55 50 H 57" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>