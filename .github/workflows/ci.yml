name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Secret Scanning Gate (TruffleHog)
  # =========================================================================
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # =========================================================================
  # 2. Backend CI (.NET 10: Format, Vulnerabilities, Build, Unit/Integration Tests)
  # =========================================================================
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj
          dotnet restore tests/Hospital_CRM.Tests/Hospital_CRM.Tests.csproj

      - name: Vulnerable Package Audit
        run: |
          dotnet list backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj package --vulnerable
          dotnet list backend/Hospital_CRM.Infrastructure/Hospital_CRM.Infrastructure.csproj package --vulnerable

      - name: Code Formatting Check (dotnet format)
        run: dotnet format backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj --verify-no-changes

      - name: Build Solution (Release)
        run: |
          dotnet build backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj -c Release --no-restore
          dotnet build tests/Hospital_CRM.Tests/Hospital_CRM.Tests.csproj -c Release --no-restore

      - name: Run Automated Test Suite
        run: dotnet test tests/Hospital_CRM.Tests/Hospital_CRM.Tests.csproj -c Release --no-build --verbosity normal

  # =========================================================================
  # 3. Frontend CI (React 19 + TypeScript: Lint & Build)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node 22 / React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Lint (Oxlint)
        run: npm run lint

      - name: Production Bundle Verification (Vite + TypeScript)
        run: npm run build

  # =========================================================================
  # 4. Playwright Headless E2E Verification
  # =========================================================================
  playwright-e2e:
    name: Playwright Headless E2E
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build Frontend for Preview
        run: npm run build

      - name: Run E2E Smoke Tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
